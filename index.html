<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'self'; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; img-src 'self' data:;" />
  <title>minimal-editor</title>
</head>
<body>
  <div id="app">
    <div id="toolbar">
      <button id="btn-open" title="Open folder (Ctrl+O)">Open</button>
      <div id="mode-tabs">
        <button id="tab-files" class="active">Files</button>
        <button id="tab-changes">Changes</button>
      </div>
      <input id="search" type="text" placeholder="Search files &amp; content (Enter)" spellcheck="false" />
    </div>
    <div id="main">
      <div id="sidebar"></div>
      <div id="editor-pane">
        <div id="tabs"></div>
        <div id="editor"></div>
        <div id="empty">Open a folder to start. No accounts, no extensions, no popups.</div>
      </div>
    </div>
    <div id="statusbar"><span id="status-left">ready</span><span id="status-right"></span></div>
  </div>
  <script type="module" src="/src/renderer.ts"></script>
</body>
</html>
